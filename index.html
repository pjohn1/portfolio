y":10,"h":154,"w":12,"minH":70,"autoHeight":true,"enableMinHeight":true,"version":"v2"},"prompt":{"draftjs-0":{"json":{"entityMap":{},"blocks":[{"key":"484t9","text":"Add your name to your ePortfolio or a title that reflects its purpose. This information will show on every page of your ePortfolio and is a create place to add personal branding. If you are creating this ePortfolio for a course or a specific project you may want to add the course or project name here as well. You may also wish to add your major, graduation date or other information you would like to display throughout your ePortfolio.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}}]}}},"settings":{"displayName":false,"displayPrompt":true,"instructional":false,"private":false},"styles":{"fontFamily":"Lato","color":"#ECEFF1","fontSize":16,"version":"v2","padding":10,"header-one":{"fontFamily":"Playfair Display"}},"classes":["m83751993"]}],"prompt":{},"settings":{"displayName":false,"displayPrompt":false,"instructional":false,"metaData":{},"private":false,"tags":[]},"styles":{"contentBackgroundColor":{"backgroundColor":"#00695C","opacity":1},"version":"v2","slideBackgroundColor":{"backgroundColor":"#00695C","opacity":1},"slideBackgroundImage":{}}},{"id":86935758,"pageId":75911924,"portfolioId":4560319,"isDraft":true,"name":null,"order":25,"isHeader":false,"isHidden":false,"modules":[{"id":276900699,"sourceId":0,"pageId":75911924,"slideId":86935758,"type":"richtxt","isDraft":true,"name":null,"order":0,"isHidden":false,"content":{"draftjs-0":{"json":{"blocks":[{"key":"aomhd","text":"Research (Undergraduate Research Opportunities Program)","type":"header-two","depth":0,"inlineStyleRanges":[{"offset":0,"length":55,"style":"BOLD"}],"entityRanges":[],"data":{}},{"key":"9pcbo","text":"MIT has a fantastic program called the UROP which allowed me to collaborate with Ph.D. students to aid them in their thesis work with hands-on work.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}}],"entityMap":{}}}},"position":{"x":0,"y":0,"h":207,"w":12,"minH":197,"autoHeight":true,"enableMinHeight":true,"version":"v2"},"prompt":{},"settings":{"displayName":false,"displayPrompt":false,"instructional":false,"metaData":{},"private":false,"tags":[]},"styles":{"version":"v2","fontFamily":"Lato","fontSize":16,"color":"#263238","textAlign":"left","name":{"fontSize":40},"padding":40,"header-one":{"fontFamily":"Playfair Display","fontSize":25,"color":"","textAlign":"","padding":0},"blockquote":{"fontFamily":"Source Serif Pro","fontSize":19,"color":"#616161","textAlign":"","padding":35,"blockquoteStyle":"doubleQuotation"},"equation":{"fontSize":"","color":"","borderColor":"","backgroundColor":"","padding":0},"link":{"fontFamily":"","fontSize":"","color":"#337ab7","padding":0,"textDecoration":""},"linkHover":{"color":"#337ab7"},"bulletList":{"fontFamily":"","fontSize":"","color":"","textAlign":"","listStyleType":"disc","padding":0},"numberList":{"fontFamily":"","fontSize":"","color":"","textAlign":"","listStyleType":"decimal","padding":0},"backgroundColor":{"backgroundColor":"#263238","opacity":0},"backgroundImage":{"backgroundSize":"cover","backgroundAttachment":"fixed","opacity":1}},"classes":[]},{"id":277809458,"sourceId":0,"pageId":75911924,"slideId":86935758,"type":"richtxt","isDraft":true,"name":null,"order":0,"isHidden":false,"content":{"draftjs-0":{"json":{"blocks":[{"key":"4ne2r","text":"Projects","type":"header-two","depth":0,"inlineStyleRanges":[{"offset":0,"length":8,"style":"BOLD"}],"entityRanges":[],"data":{}},{"key":"gkq7","text":"Prediction Space Debris Populations through Deep Neural Networks (Spring 2023)","type":"unstyled","depth":0,"inlineStyleRanges":[{"offset":0,"length":78,"style":"BOLD"}],"entityRanges":[],"data":{}},{"key":"6svh7","text":"Technical Skills: Machine Learning, TensorFlow, Keras, Physics-Informed Neural Network","type":"unstyled","depth":0,"inlineStyleRanges":[{"offset":0,"length":18,"style":"BOLD"}],"entityRanges":[],"data":{}},{"key":"ca3dr","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"f56o1","text":"In this project, I aided Pablo Machuca (now a professor at SDSU) under the guidance of Richard Linares to create a machine learning model trained on Monte Carlo simulation outputs to predict what future outputs would be.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"bquod","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"1umu7","text":"Space debris models are complex systems of nonlinear equations that do not have closed form solutions and must be solved iteratively. Because of this, we wanted to create a machine learning model that could understand the underlying patterns of the space debris and predict future patterns to significantly speed up computation.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"b55sm","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"6jurr","text":"Neither myself or Pablo had much ML experience, and we iterated through multiple designs of the machine learning model. We settled on a Physics-Informed Neural Network (modified sequential neural network) to perform this task. We were able to replicate results at low dimensions, but this task was unfortunately too complex to solve in one semester's work.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"1nbr","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"a4ko5","text":"Regardless, I aided in creating a conference abstract which was submitted and accepted to the \"Space capacity allocation for the sustainability of space activities\" workshop in 2023.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"60sbd","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"107ps","text":"Spin Ap (Fall 2021)","type":"unstyled","depth":0,"inlineStyleRanges":[{"offset":0,"length":19,"style":"BOLD"}],"entityRanges":[],"data":{}},{"key":"3lvkm","text":"Technical Skills: ROS, PyQt, UI","type":"unstyled","depth":0,"inlineStyleRanges":[{"offset":0,"length":18,"style":"BOLD"}],"entityRanges":[],"data":{}},{"key":"69hao","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"2f53n","text":"To aid in the testing of a spinning aperture telescope, I created a GUI using ROS and PyQt. This involved using ROS topics to send and receive data about the system states and statuses.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"66da7","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"6bir4","text":"I performed this work under the supervision of Ph.D. candidate Evan Kramer (currently a PostDoc at CalTech) and Dr. Rebecca Masterson in the Space Systems Laboratory.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"cs1c8","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"52q44","text":"Ground Station Development for the ISS Astrobee Robot (Spring 2021)","type":"unstyled","depth":0,"inlineStyleRanges":[{"offset":0,"length":67,"style":"BOLD"}],"entityRanges":[],"data":{}},{"key":"blvu0","text":"Technical Skills: ROS, Java, Android Studio","type":"unstyled","depth":0,"inlineStyleRanges":[{"offset":0,"length":18,"style":"BOLD"}],"entityRanges":[],"data":{}},{"key":"batbe","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"b7b0v","text":"The Tumbledock project was run by Keenan Albee (currently a professor at USC) and involved tracking and intercepting space debris. To test this concept, NASA's Astrobee robot was used under microgravity conditions.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"3fqcg","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"2kmb9","text":"On the Astrobee, there are two processors from different manufacturers that need to communicate with each other, and ROS was used as the middleware to accomplish this.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"aprph","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"17jp3","text":"My purpose in this project was to use ROS to advertise different states of the system and set up test cases to switch between control systems of the robot.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"5k42v","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"2dqui","text":"Additionally, most testing was performed remotely (over Zoom) in collaboration with NASA - Ames, so I set up LED telemetry to communicate which testing modes the robot was in.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"a6ak7","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"3ro7a","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}}],"entityMap":{}}}},"position":{"x":0,"y":217,"h":1118,"w":12,"minH":967,"autoHeight":true,"enableMinHeight":true,"version":"v2"},"prompt":{},"settings":{"displayName":false,"displayPrompt":false,"instructional":false,"metaData":{},"private":false,"tags":[]},"styles":{"version":"v2","fontFamily":"Lato","fontSize":16,"color":"#263238","textAlign":"left","name":{"fontSize":40},"padding":40,"header-one":{"fontFamily":"Playfair Display","fontSize":25,"color":"","textAlign":"","padding":0},"blockquote":{"fontFamily":"Source Serif Pro","fontSize":19,"color":"#61616 ou may want to add the course or project name here as well. You may also wish to add your major, graduation date or other information you would like to display throughout your ePortfolio.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}}]}}},"settings":{"displayName":false,"displayPrompt":true,"instructional":false,"private":false},"styles":{"fontFamily":"Lato","color":"#ECEFF1","fontSize":16,"version":"v2","padding":10,"header-one":{"fontFamily":"Playfair Display"}},"classes":["m83751993"]}],"prompt":{},"settings":{"displayName":false,"displayPrompt":false,"instructional":false,"metaData":{},"private":false,"tags":[]},"styles":{"contentBackgroundColor":{"backgroundColor":"#00695C","opacity":1},"version":"v2","slideBackgroundColor":{"backgroundColor":"#00695C","opacity":1},"slideBackgroundImage":{}}},{"id":88279959,"pageId":75911925,"portfolioId":4560319,"isDraft":true,"name":null,"order":2,"isHeader":false,"isHidden":false,"modules":[{"id":279825834,"sourceId":0,"pageId":75911925,"slideId":88279959,"type":"richtxt","isDraft":true,"name":null,"order":0,"isHidden":false,"content":{"draftjs-0":{"json":{"blocks":[{"key":"8t2it","text":"Multi-Agent Coordination of Miniature Autonomous Blimps","type":"header-two","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"7mtn8","text":"Technical Skills:  Hardware/MCU Setup, ROS2, Sensor Calibration, SLAM, Consensus Protocol","type":"unstyled","depth":0,"inlineStyleRanges":[{"offset":0,"length":17,"style":"BOLD"}],"entityRanges":[],"data":{}},{"key":"cfigm","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"eem52","text":"Overview: This project is my year-long Master of Engineering project in the C3 Group at Cornell under the supervision of Professor Anastasia Bizyaeva. It involves setting up a set of miniature autonomous blimps (essentially motor chassis with balloons) developed originally at Georgia Tech. The goal is to leverage multi-agent consensus to perform compute-heavy tasks (i.e. Visual SLAM) on compute-constrained agents. Because this project is ongoing, I will list my accomplishments as I complete them.","type":"unstyled","depth":0,"inlineStyleRanges":[{"offset":0,"length":9,"style":"BOLD"}],"entityRanges":[],"data":{}},{"key":"14pqd","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"26f7","text":"Accomplishments so far:","type":"unstyled","depth":0,"inlineStyleRanges":[{"offset":0,"length":23,"style":"BOLD"}],"entityRanges":[],"data":{}},{"key":"iii0","text":"- Set up hardware including UFL connectors (huge accomplishment), PWM motors, microcontrollers","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"1cgu","text":"- Debugged Arduino ESP32 boards to get data over WiFi from onboard sensors to ground station","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"d1cjt","text":"- Programmed motor write duties for individual motor control","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"ktf3","text":"- Figured out how to communicate data over serial using C structs and bytestrings","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"amgqp","text":"- Setup OptiTrack system for ground truth localization","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"felv9","text":"- Calibrated IMUs","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"7fig8","text":"- Fixed euler angle PID controllers","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"9l3fm","text":"- Developing LQG controller for altitude control","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}}],"entityMap":{}}}},"position":{"x":0,"y":10,"h":523,"w":12,"minH":523,"autoHeight":true,"enableMinHeight":tr der":0,"isHidden":false,"content":{"draftjs-0":{"json":{"blocks":[{"key":"4euoc","text":"Re-designing Robots: Interactive Lobby Robot","type":"header-two","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"eu8j2","text":"Technical Skills: Prototyping, MCU Development, Field Testing, AI Integration","type":"unstyled","depth":0,"inlineStyleRanges":[{"offset":0,"length":17,"style":"BOLD"}],"entityRanges":[],"data":{}},{"key":"3t9gl","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"f0hc8","text":"Overview: For my human-robot interaction studio class, we are going through the entire process from ideation to manufacturing of a robot that is in the environment of Cornell's Statler hotel. My team and I wanted to create a robot that would offer a way for people to interact with each other in the lobby, and I came up with the idea of a mobile \"building\" platform that offers people a puzzle piece, Lego piece, etc. to contribute to the current build.","type":"unstyled","depth":0,"inlineStyleRanges":[{"offset":0,"length":10,"style":"BOLD"}],"entityRanges":[],"data":{}},{"key":"22k92","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"b9dfr","text":"The goal is to drive this interaction through how the robot moves and not use audio cues. Over time, I will update this section with videos showcasing the process and integration of our ideas. The goal for this project is to be accepted into the HRI 2026 conference.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"419h9","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"en5ov","text":"Accomplishments so far:","type":"unstyled","depth":0,"inlineStyleRanges":[{"offset":0,"length":23,"style":"BOLD"}],"entityRanges":[],"data":{}},{"key":"5jq2r","text":"- Interviewed Statler Hotel employees to identify pain points of daily processes.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"fa1tn","text":"- \"Wizard of Oz\" prototype to experiment with interaction behaviors in a hallway setting","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"1his0","text":"- Integrated a lightweight person detection model to have a set of \"eyes\" follow people as they walk past","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"5scdb","text":"- Deconstructed a hoverboard for motion control using an O-Drive","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"d6ceo","text":"- Setup a Raspberry Pi 5 to drive onboard processes of the robot ","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}}],"entityMap":{}}}},"position":{"x":0,"y":0,"h":523,"w":12,"autoHeight":true,"enableMinHeight":true,"version":"v2"},"prompt":{},"settings":{"displayName":false,"displayPrompt":false,"instructional":false,"metaData":{},"private":false,"tags":[]},"styles":{"version":"v2","fontFamily":"Lato","fontSize":16,"color":"#263238","textAlign":"left","name":{"fontSize":40},"padding":40,"header-one":{"fontFamily":"Playfair Display","fontSize":25,"color":"","textAlign":"","padding":0},"blockquote":{"fontFamily":"Source Serif Pro","fontSize":19,"color":"#616161","textAlign":"","padding":35,"blockquoteStyle":"doubleQuotation"},"equation":{"fontSize":"","color":"","borderColor":"","backgroundColor":"","padding":0},"link":{"fontFamily":"","fontSize":"","color":"#337ab7","padding":0,"textDecoration":""},"linkHover":{"color":"#337ab7"},"bulletList":{"fontFamily":"","fontSize":"","color":"","textAlign":"","listStyleType":"disc","padding":0},"numberList":{"fontFamily":"","fontSize":"","color":"","textAlign":"","listStyleType":"decimal","padding":0},"backgroundColor":{"backgroundColor":"#263238","opacity":0},"backgroundImage":{"backgroundSize":"cover","backgroundAttachment":"fixed", ":[]},"styles":{"contentBackgroundColor":{"backgroundColor":"#00695C","opacity":1},"version":"v2","slideBackgroundColor":{"backgroundColor":"#00695C","opacity":1},"slideBackgroundImage":{}}},{"id":86935762,"pageId":75911926,"portfolioId":4560319,"isDraft":true,"name":null,"order":35,"isHeader":false,"isHidden":false,"modules":[{"id":276567248,"sourceId":110492323,"pageId":75911926,"slideId":86935762,"type":"richtxt","isDraft":true,"name":null,"order":0,"isHidden":false,"content":{"draftjs-0":{"json":{"blocks":[{"key":"ehq59","text":"The Aerospace Corporation","type":"header-two","depth":0,"inlineStyleRanges":[{"offset":0,"length":25,"style":"BOLD"}],"entityRanges":[],"data":{}},{"key":"hmkc","text":"Technical Skills: Python, Dash, Docker, Kubernetes","type":"unstyled","depth":0,"inlineStyleRanges":[{"offset":0,"length":50,"style":"BOLD"}],"entityRanges":[],"data":{}},{"key":"dbcnu","text":"Soft skills: Teamwork, Briefing Presentations, Interdisciplinary Communication","type":"unstyled","depth":0,"inlineStyleRanges":[{"offset":0,"length":78,"style":"BOLD"}],"entityRanges":[],"data":{}},{"key":"ds99e","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"f0n0h","text":"When I joined The Aerospace Corporation as an intern, they were going through management changes which left me without a manager for multiple weeks. There was an outline of a project that they wanted me to head, but there was not much direction without the manager.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"bkm49","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"2vm3r","text":"This project involved making a dashboard that displayed the loading profiles through different parts of launch and compared those profiles with previous launches of the same rocket.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"cltd5","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"3ipu5","text":"With no manager, I took it upon myself to make multiple versions of this dashboard, share them with members of the team to get feedback, and finalize it. All of this was done so quickly that I still did not have a manager at the end of this project.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"17jql","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"6aj0b","text":"After the completion of this project, I created another dashboard that tracked different day-of-launch quantities such as percent-of-limit, wind profiles, and loading simulation outputs.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"e5ub2","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"60biu","text":"With no simulation for the day-of-launch process, I created one that used mock data to emulate what that process would look like, and I presented this animated dashboard to teams of engineers to gather feedback.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"13b19","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"evn9o","text":"When I finished my internship, I was told that this dashboard was used on a subsequent launch and worked both immediately and successfully.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"7jbpm","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}}],"entityMap":{}}}},"position":{"x":0,"y":10,"h":661,"w":12,"minH":390,"autoHeight":true,"enableMinHeight":true,"version":"v2"},"prompt":{},"settings":{"displayName":false,"displayPrompt":false,"instructional":false,"private":false},"styles":{"fontFamily":"Lato","fontSize":16,"color":"#263238","padding ,"data":{}},{"key":"bbqr4","text":"Soft Skills: Scrum master, Time management (understanding expected length of a task)","type":"unstyled","depth":0,"inlineStyleRanges":[{"offset":0,"length":84,"style":"BOLD"}],"entityRanges":[],"data":{}},{"key":"7cnrm","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"9q0uf","text":"At Northrop Grumman, I was immediately faced with the task of learning a new programming language. On the simulations team, all of the drivers used C++, and I had to teach myself this language before starting.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"3ucsg","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"2r1g6","text":"With my coworkers, we completed various sprint-based tasks to optimize and debug the drivers. These could be anything from fixing a segmentation fault to adding functionalities.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"a9cij","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"9tp4l","text":"While I was there, I noticed that there were a significant number of coding standards issues flagged by their automated tool. In a meeting with my manager, I suggested that I create a script to clean up these flags. He was a bit hesitant, as the script had to be robust enough to fix the flags without breaking the drivers, but he agreed.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"8695k","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"6jttm","text":"After I developed this script, I was able to cut down the coding standard flags by ~90% (around 13,000 total) without affecting the performance of the drivers. This was a much-needed codebase cleanup, and the script is optimized to work in the future for whenever they might need it.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"31hnd","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"8fmp5","text":"","type":"header-two","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}}],"entityMap":{}}}},"position":{"x":0,"y":0,"h":623,"w":12,"autoHeight":true,"enableMinHeight":true,"version":"v2"},"prompt":{},"settings":{"displayName":false,"displayPrompt":false,"instructional":false,"metaData":{},"private":false,"tags":[]},"styles":{"version":"v2","fontFamily":"Lato","fontSize":16,"color":"#263238","textAlign":"left","name":{"fontSize":40},"padding":40,"header-one":{"fontFamily":"Playfair Display","fontSize":25,"color":"","textAlign":"","padding":0},"blockquote":{"fontFamily":"Source Serif Pro","fontSize":19,"color":"#616161","textAlign":"","padding":35,"blockquoteStyle":"doubleQuotation"},"equation":{"fontSize":"","color":"","borderColor":"","backgroundColor":"","padding":0},"link":{"fontFamily":"","fontSize":"","color":"#337ab7","padding":0,"textDecoration":""},"linkHover":{"color":"#337ab7"},"bulletList":{"fontFamily":"","fontSize":"","color":"","textAlign":"","listStyleType":"disc","padding":0},"numberList":{"fontFamily":"","fontSize":"","color":"","textAlign":"","listStyleType":"decimal","padding":0},"backgroundColor":{"backgroundColor":"#263238","opacity":0},"backgroundImage":{"backgroundSize":"cover","backgroundAttachment":"fixed","opacity":1}},"classes":[]}],"prompt":{},"settings":{"displayName":false,"displayPrompt":false,"instructional":false,"metaData":{},"private":false,"tags":[]},"styles":{"version":"v2","slideBackgroundColor":{"backgroundColor":"#CFD8DC","opacity":1},"slideBackgroundImage":{"backgroundAttachment":"fixed","backgroundSize":"cover","opacity":1,"backgroundImage":""},"contentBackgroundColor":{"backgroundColor":"#CFD8DC","opacity":1},"contentBackgroundImage":{"backgroundAttachment":"scroll","backgroundSize":"cover","opacity":1, ":[{"id":276902529,"sourceId":0,"pageId":75911927,"slideId":86935764,"type":"richtxt","isDraft":true,"name":null,"order":0,"isHidden":false,"content":{"draftjs-0":{"json":{"blocks":[{"key":"9rgeq","text":"Leadership","type":"header-two","depth":0,"inlineStyleRanges":[{"offset":0,"length":10,"style":"BOLD"}],"entityRanges":[],"data":{}},{"key":"4duss","text":"MIT Men's Volleyball Team","type":"unstyled","depth":0,"inlineStyleRanges":[{"offset":0,"length":25,"style":"BOLD"}],"entityRanges":[],"data":{}},{"key":"2p5ih","text":"Captain","type":"unstyled","depth":0,"inlineStyleRanges":[{"offset":0,"length":7,"style":"BOLD"},{"offset":0,"length":7,"style":"ITALIC"}],"entityRanges":[],"data":{}},{"key":"aulas","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"dbrs5","text":"I was a 3 year starter (first year canceled due to COVID) on the volleyball team, and I was a captain during my senior season. The most growth that I have experienced in my life is through this team, and the greatest lesson that I learned is that the best leaders are there to serve the needs of those that they are leading. ","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"7dh28","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"e771c","text":"Improving in a sport requires tremendous humility and trust in those around you. The mindset that I acquired through volleyball is, by far, the most transferable skill that I will have going into the robotics industry. It is one that can only be acquired through failing, getting back up, and learning how to be better.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"3athn","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"apput","text":"Theta Tau Professional Engineering Society","type":"unstyled","depth":0,"inlineStyleRanges":[{"offset":0,"length":42,"style":"BOLD"}],"entityRanges":[],"data":{}},{"key":"cegsg","text":"Social Chair","type":"unstyled","depth":0,"inlineStyleRanges":[{"offset":0,"length":12,"style":"BOLD"},{"offset":0,"length":12,"style":"ITALIC"}],"entityRanges":[],"data":{}},{"key":"7g458","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"18u0v","text":"Theta Tau was a vessel for me to meet some of the most motivated and intentional people that I know. Through the social chair position, I was able to meet people outside of my organization and coordinate events for them to meet those that I hold highly.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"75jnd","text":"","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}},{"key":"9hot9","text":"My favorite achievement from this position was coordinating a 65-person formal event that included transportation to a cabin in Vermont, logistics around feeding all of them, and managing any potential conflicts. This event went perfectly, and there was no better reward than the praise from my friends for figuring it all out.","type":"unstyled","depth":0,"inlineStyleRanges":[],"entityRanges":[],"data":{}}],"entityMap":{}}}},"position":{"x":0,"y":0,"h":615,"w":12,"autoHeight":true,"enableMinHeight":true,"version":"v2"},"prompt":{},"settings":{"displayName":false,"displayPrompt":false,"instructional":false,"metaData":{},"private":false,"tags":[]},"styles":{"version":"v2","fontFamily":"Lato","fontSize":16,"color":"#263238","textAlign":"left","name":{"fontSize":40},"padding":40,"header-one":{"fontFamily":"Playfair Display","fontSize":25,"color":"","textAlign":"","padding":0},"blockquote":{"fontFamily":"Source Serif Pro","fontSize":19,"color":"#616161","textAlign":"","padding":35,"blockquoteStyle":"doubleQuotation"},"equation":{"fontSize":"","color":"","borderColor":"","backgroundColor":"","padding":0},"link":{"fontFamily":"","fontSize":"","colo
